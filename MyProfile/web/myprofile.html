<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Profile Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile-card">
	<div class="card-header">
		<h1>Personal Profile Form</h1>
		<p>Please enter your student details below.</p>
	</div>

	<form action="ProfileServlet" method="post">
		<div class="form-group">
			<label for="name">Name</label>
			<input type="text" id="name" name="name" required>
		</div>

		<div class="form-group">
			<label for="studentId">Student ID</label>
			<input type="text" id="studentId" name="studentId" required>
		</div>

		<div class="form-group">
			<label for="programme">Programme</label>
			<input type="text" id="programme" name="programme" required>
		</div>

		<div class="form-group">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" required>
		</div>

		<div class="form-group">
			<label for="hobbies">Hobbies</label>
			<input type="text" id="hobbies" name="hobbies">
		</div>

		<div class="form-group">
			<label for="intro">Short Self-Introduction</label>
			<textarea id="intro" name="intro" rows="4"></textarea>
		</div>

		<div class="button-group">
			<input type="submit" value="Submit Profile" class="btn-primary">
			<input type="reset" value="Reset" class="btn-secondary">
		</div>
	</form>
</div>

</body>
</html>
